<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ball Sort Puzzle</title>
<script src="https://yandex.ru/games/sdk/v2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#0f0f1e;min-height:100vh;color:#fff;overflow:hidden}
.bg{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(45deg,#0a0a15 25%,transparent 25%),linear-gradient(-45deg,#0a0a15 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#0a0a15 75%),linear-gradient(-45deg,transparent 75%,#0a0a15 75%);background-size:40px 40px;background-position:0 0,0 20px,20px -20px,-20px 0;background-color:#0f0f1e;z-index:-1}
.scr{position:fixed;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;z-index:10}.scr.on{display:flex}
#menu{justify-content:center;gap:30px;padding:20px;z-index:10}
.logo{text-align:center}.logo-i{font-size:80px;margin-bottom:10px;filter:drop-shadow(0 0 20px rgba(233,69,96,.5))}
.logo h1{font-size:42px;font-weight:900;background:linear-gradient(90deg,#e94560,#f39c12);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.logo p{font-size:13px;opacity:.6;margin-top:5px;letter-spacing:3px;text-transform:uppercase}
.btns{display:flex;flex-direction:column;gap:15px;width:100%;max-width:300px}
.btn{background:linear-gradient(135deg,#e94560,#f39c12);border:none;color:#fff;padding:18px 30px;border-radius:15px;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 5px 20px rgba(233,69,96,.4);transition:transform .2s}
.btn:hover{transform:translateY(-3px)}.btn.sec{background:rgba(255,255,255,.1);box-shadow:none;border:2px solid rgba(255,255,255,.2)}
.stats{display:flex;gap:20px;margin-top:20px}
.stat{background:rgba(255,255,255,.05);padding:15px 25px;border-radius:15px;text-align:center}
.stat-v{font-size:24px;font-weight:bold;color:#f39c12}.stat-l{font-size:11px;opacity:.6;text-transform:uppercase}
#levels{padding-top:80px;z-index:10}
.hdr{position:fixed;top:0;left:0;right:0;background:rgba(15,15,30,.95);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;z-index:100;border-bottom:1px solid rgba(255,255,255,.1)}
.bbtn{background:rgba(255,255,255,.1);border:none;color:#fff;width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.htitle{font-size:20px;font-weight:bold}
.cdisp{background:rgba(255,215,0,.2);padding:8px 15px;border-radius:20px;font-weight:bold;color:#ffd700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;max-width:400px;width:100%;padding:20px}
.lvbtn{aspect-ratio:1;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.lvbtn:hover{transform:scale(1.05)}.lvbtn.done{background:linear-gradient(135deg,rgba(46,204,113,.3),rgba(39,174,96,.3));border-color:#2ecc71}
.lvbtn.cur{background:linear-gradient(135deg,#e94560,#f39c12);border-color:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,.7)}50%{box-shadow:0 0 0 10px rgba(233,69,96,0)}}
.lvbtn.lock{opacity:.3}
.lvnum{font-size:28px;font-weight:bold}.lvstars{font-size:14px;margin-top:5px}
#game{padding:0;z-index:10}
.ghdr{position:fixed;top:0;left:0;right:0;background:rgba(15,15,30,.95);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;z-index:100}
.rbtn{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#3498db,#2980b9);border:none;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 15px rgba(52,152,219,.4)}
.ldisp{text-align:center}.ldisp-l{font-size:14px;opacity:.6}.ldisp-v{font-size:32px;font-weight:bold}
.ccoins{position:fixed;top:15px;right:20px;background:rgba(0,0,0,.5);padding:8px 15px;border-radius:25px;display:flex;align-items:center;gap:8px;z-index:101}
.cicon{width:35px;height:35px;background:radial-gradient(circle at 30% 30%,#ffd700,#f39c12);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#8b6914;font-size:18px}
.camount{font-size:22px;font-weight:bold}
.garea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 15px 110px;width:100%}
.tcont{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:500px}
.tube{width:52px;height:210px;cursor:pointer;transition:transform .3s;position:relative}
.tube.sel{transform:translateY(-20px)}
.tbody{width:100%;height:100%;border:3px solid rgba(255,255,255,.8);border-top:none;border-radius:0 0 26px 26px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.3));position:relative;overflow:hidden}
.ball{width:42px;height:42px;border-radius:50%;position:absolute;left:50%;transform:translateX(-50%);box-shadow:inset -5px -5px 10px rgba(0,0,0,.3),inset 3px 3px 8px rgba(255,255,255,.4),0 2px 5px rgba(0,0,0,.3);transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.ball::before{content:'';position:absolute;top:7px;left:10px;width:14px;height:9px;background:rgba(255,255,255,.6);border-radius:50%;transform:rotate(-30deg)}
.ball.fall{animation:drop .4s ease-out}
@keyframes drop{0%{transform:translateX(-50%) translateY(-30px);opacity:.5}100%{transform:translateX(-50%) translateY(0);opacity:1}}
.pups{display:flex;gap:20px;position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:50}
.pbtn{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#3498db,#2980b9);border:none;color:#fff;font-size:28px;cursor:pointer;box-shadow:0 5px 20px rgba(52,152,219,.4);position:relative;transition:transform .2s}
.pbtn:hover{transform:translateY(-3px)}.pbtn:disabled{opacity:.4}
.pcnt{position:absolute;bottom:-5px;right:-5px;background:#e94560;width:25px;height:25px;border-radius:50%;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.ad-badge{position:absolute;top:-5px;left:-5px;background:#ffd700;width:24px;height:24px;border-radius:50%;font-size:13px;display:none;align-items:center;justify-content:center;border:2px solid #fff;animation:pulse 1.5s infinite;z-index:5}
.ad-badge.show{display:flex}
.ad-hint{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);background:rgba(255,215,0,.2);border:1px solid rgba(255,215,0,.4);padding:10px 18px;border-radius:25px;font-size:13px;color:#ffd700;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:60;backdrop-filter:blur(10px);box-shadow:0 4px 15px rgba(0,0,0,.3)}
.ad-hint.show{opacity:1}
#win{background:rgba(0,0,0,.9);justify-content:center;padding:20px;z-index:200}
.wc{text-align:center;max-width:450px;animation:popIn .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.crown{font-size:100px;filter:drop-shadow(0 0 30px rgba(255,215,0,.8));animation:bounce 1.5s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-15px) scale(1.05)}}
.vtext{font-size:72px;font-weight:900;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.8),0 4px 0 #b8860b,0 6px 0 #8b6914;margin:10px 0 20px;animation:vpulse 2s ease-in-out infinite}
@keyframes vpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.psec{margin:15px 0}
.plbl{font-size:18px;font-weight:bold;margin-bottom:8px}
.pbcont{position:relative;height:35px;background:rgba(255,255,255,.15);border-radius:20px;margin-bottom:5px}
.pbfill{height:100%;background:linear-gradient(180deg,#7fff00,#32cd32,#228b22);border-radius:20px;transition:width 1s;box-shadow:0 0 15px rgba(127,255,0,.6)}
.ptxt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:bold}
.prew{position:absolute;right:-20px;top:50%;transform:translateY(-50%);font-size:50px;animation:rbounce 1s ease-in-out infinite}
@keyframes rbounce{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-60%) scale(1.1)}}
.nbtn{background:linear-gradient(180deg,#ffd700,#ffb347,#ff8c00);border:none;color:#fff;font-size:36px;font-weight:900;padding:20px 80px;border-radius:50px;cursor:pointer;margin-top:25px;box-shadow:0 6px 0 #cc7000,0 8px 20px rgba(0,0,0,.4);letter-spacing:2px;transition:all .1s}
.nbtn:hover{transform:translateY(-2px)}.nbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #cc7000}
.conf{position:fixed;width:12px;height:12px;top:-20px;animation:cfall linear forwards;z-index:300;pointer-events:none}
@keyframes cfall{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(100vh) rotate(1080deg) scale(.5);opacity:0}}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-100px);background:#2ecc71;padding:12px 24px;border-radius:12px;font-weight:bold;z-index:2000;transition:transform .4s;box-shadow:0 5px 20px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}.toast.err{background:#e74c3c}
.ad-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.ad-overlay.on{display:flex}
.ad-modal{background:linear-gradient(135deg,#1a1a2e,#16213e);border:2px solid rgba(255,215,0,.3);border-radius:25px;padding:30px;max-width:350px;width:100%;text-align:center;animation:popIn .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ad-icon{font-size:80px;margin-bottom:15px;animation:bounce 1s ease-in-out infinite}
.ad-title{font-size:28px;font-weight:900;color:#ffd700;margin-bottom:10px;text-shadow:0 0 20px rgba(255,215,0,.5)}
.ad-text{font-size:16px;color:#fff;margin-bottom:20px;line-height:1.5;opacity:.9}
.ad-reward{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:15px;padding:12px;margin-bottom:20px;font-size:18px;font-weight:bold;color:#ffd700}
.ad-btns{display:flex;gap:10px}
.ad-btn{flex:1;padding:15px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;border:none;transition:transform .2s}
.ad-btn:hover{transform:translateY(-2px)}
.ad-btn.cancel{background:rgba(255,255,255,.1);color:#fff}
.ad-btn.watch{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#fff;box-shadow:0 4px 15px rgba(255,215,0,.4)}
@media(max-width:400px){.tube{width:44px;height:180px}.ball{width:36px;height:36px}.logo h1{font-size:32px}.vtext{font-size:56px}.nbtn{font-size:28px;padding:15px 60px}.grid{grid-template-columns:repeat(3,1fr);gap:10px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="scr on" id="menu">
  <div class="logo"><div class="logo-i">🧪</div><h1>BALL SORT</h1><p>Color Puzzle Game</p></div>
  <div class="btns">
    <button class="btn" onclick="go('levels')">▶ ИГРАТЬ</button>
    <button class="btn sec" onclick="alert('Скоро!')">🛒 МАГАЗИН</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-v" id="mLv">1</div><div class="stat-l">Уровень</div></div>
    <div class="stat"><div class="stat-v" id="mCo">0</div><div class="stat-l">Монеты</div></div>
  </div>
</div>

<div class="scr" id="levels">
  <div class="hdr">
    <button class="bbtn" onclick="go('menu')">←</button>
    <div class="htitle">Выбор уровня</div>
    <div class="cdisp">💰 <span id="lCo">0</span></div>
  </div>
  <div class="grid" id="lGrid"></div>
</div>

<div class="scr" id="game">
  <div class="ghdr">
    <button class="rbtn" onclick="go('levels')">←</button>
    <div class="ldisp"><div class="ldisp-l">Level</div><div class="ldisp-v" id="gLv">1</div></div>
    <button class="rbtn" onclick="restart()">🔄</button>
  </div>
  <div class="ccoins"><div class="cicon">$</div><div class="camount" id="gCo">50</div></div>
  <div class="garea"><div class="tcont" id="board"></div></div>
  <div class="pups">
    <button class="pbtn" onclick="hint()">💡<div class="pcnt" id="hC">2</div><div class="ad-badge" id="hAd">📺</div></button>
    <button class="pbtn" onclick="undo()"><div class="pcnt" id="uC">5</div><div class="ad-badge" id="uAd">📺</div></button>
  </div>
</div>

<div class="scr" id="win">
  <div class="wc">
    <div class="crown">👑</div>
    <div class="vtext">Victory!</div>
    <div class="psec">
      <div class="plbl">Reach Level <span id="pLv1">8</span></div>
      <div class="pbcont">
        <div class="pbfill" id="pF1" style="width:37.5%"></div>
        <div class="ptxt"><span id="pC1">3</span>/<span id="pT1">8</span></div>
        <div class="prew"></div>
      </div>
    </div>
    <div class="psec">
      <div class="plbl">Reach Level <span id="pLv2">8</span></div>
      <div class="pbcont">
        <div class="pbfill" id="pF2" style="width:37.5%"></div>
        <div class="ptxt"><span id="pC2">3</span>/<span id="pT2">8</span></div>
        <div class="prew"></div>
      </div>
    </div>
    <button class="nbtn" onclick="next()">Next</button>
  </div>
</div>

<div class="ad-overlay" id="adOverlay">
  <div class="ad-modal">
    <div class="ad-icon"></div>
    <div class="ad-title">Хочешь бонус?</div>
    <div class="ad-text" id="adText">Посмотри короткую рекламу и получи награду!</div>
    <div class="ad-reward" id="adReward">+3 бонуса</div>
    <div class="ad-btns">
      <button class="ad-btn cancel" onclick="closeAdModal()">Нет, спасибо</button>
      <button class="ad-btn watch" onclick="watchAd()">Смотреть ▶</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const C=['#00d4ff','#ff4757','#2ecc71','#ffa502','#a55eea','#ff6b81','#3742fa','#2ed573','#ff6348','#7bed9f','#70a1ff','#e84393'];
let ysdk=null;

YaGames.init().then(sdk=>{
  ysdk=sdk;
  sdk.features.LoadingAPI?.ready();
  console.log('Yandex SDK loaded');
  if(sdk.features.StickyBannerAdv) sdk.features.StickyBannerAdv.show();
}).catch(e=>console.log('SDK local'));

function showFullscreenAd(){
  if(ysdk) ysdk.adv.showFullscreenAdv({callbacks:{onClose:()=>{},onError:()=>{}}});
}

function showRewardedAd(callback){
  if(ysdk){
    ysdk.adv.showRewardedVideo({
      callbacks:{
        onOpen:()=>{},
        onRewarded:()=>{if(callback)callback()},
        onClose:()=>{},
        onError:()=>{if(callback)callback()}
      }
    });
  } else {
    if(callback) callback();
  }
}

let S={lv:1,coins:50,stars:{},chest:0,tube:0,hints:2,undos:5};
let tubes=[],sel=null,moves=0,hist=[],lp={},adCallback=null;

function go(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  if(id==='menu')updMenu();
  if(id==='levels')renderLv();
}

function updMenu(){
  document.getElementById('mLv').textContent=S.lv;
  document.getElementById('mCo').textContent=S.coins;
}

function renderLv(){
  document.getElementById('lCo').textContent=S.coins;
  const g=document.getElementById('lGrid');g.innerHTML='';
  const max=Math.max(S.lv+5,20);
  for(let i=1;i<=max;i++){
    const b=document.createElement('div');
    const st=S.stars[i]||0;
    b.className='lvbtn';
    if(st>0)b.classList.add('done');
    if(i===S.lv)b.classList.add('cur');
    if(i>S.lv+1)b.classList.add('lock');
    b.innerHTML='<div class="lvnum">'+i+'</div><div class="lvstars">'+'★'.repeat(st)+'☆'.repeat(3-st)+'</div>';
    if(i<=S.lv+1){(function(lv){b.onclick=function(){startLv(lv)}})(i)}
    g.appendChild(b);
  }
}

function getLv(l){
  let n=Math.min(3+Math.floor((l-1)/3),C.length);
  let bp=4,et=2;
  if(l>15)bp=5;if(l>30)bp=6;if(l>25)et=1;
  return{n,bp,et};
}

function genLv(num){
  lp=getLv(num);
  const{ n,bp,et}=lp;
  const nt=n+et;
  const balls=[];
  for(let i=0;i<n;i++)for(let j=0;j<bp;j++)balls.push(i);
  for(let i=balls.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=balls[i];balls[i]=balls[j];balls[j]=t}
  tubes=[];let bi=0;
  for(let i=0;i<nt;i++){
    if(i<n){tubes.push(balls.slice(bi,bi+bp));bi+=bp}
    else tubes.push([]);
  }
}

function startLv(num){
  S.lv=num;
  document.getElementById('gLv').textContent=num;
  document.getElementById('gCo').textContent=S.coins;
  document.getElementById('uC').textContent=S.undos;
  document.getElementById('hC').textContent=S.hints;
  hist=[];moves=0;sel=null;
  genLv(num);render();
  updateAdBadges();
  go('game');
}

function render(){
  const bd=document.getElementById('board');bd.innerHTML='';
  for(let i=0;i<tubes.length;i++){
    const t=tubes[i];
    const te=document.createElement('div');
    te.className='tube'+(sel===i?' sel':'');
    const tb=document.createElement('div');tb.className='tbody';
    for(let j=0;j<t.length;j++){
      const b=document.createElement('div');
      b.className='ball';
      const col=C[t[j]];
      b.style.background='radial-gradient(circle at 30% 30%,'+light(col,40)+','+col+')';
      b.style.bottom=(j*44+5)+'px';
      tb.appendChild(b);
    }
    te.appendChild(tb);
    (function(idx){te.onclick=function(){click(idx)}})(i);
    bd.appendChild(te);
  }
}

function light(c,p){
  const n=parseInt(c.replace('#',''),16);
  const a=Math.round(2.55*p);
  const R=Math.min(255,(n>>16)+a);
  const G=Math.min(255,((n>>8)&0xFF)+a);
  const B=Math.min(255,(n&0xFF)+a);
  return'rgb('+R+','+G+','+B+')';
}

function done(t){
  if(t.length!==lp.bp)return false;
  for(let i=0;i<t.length;i++)if(t[i]!==t[0])return false;
  return true;
}

function click(idx){
  if(sel===null){if(tubes[idx].length>0){sel=idx;render()}}
  else if(sel===idx){sel=null;render()}
  else{move(sel,idx);sel=null}
}

function move(f,t){
  const s=tubes[f],d=tubes[t];
  if(s.length===0)return;
  if(d.length>=lp.bp)return;
  const col=s[s.length-1];
  if(d.length>0&&d[d.length-1]!==col)return;
  hist.push({f,t,ss:s.slice(),ds:d.slice()});
  while(s.length>0&&d.length<lp.bp&&s[s.length-1]===col)d.push(s.pop());
  moves++;render();check();
}

function check(){
  let ok=true,has=false;
  for(let i=0;i<tubes.length;i++){
    if(tubes[i].length>0)has=true;
    if(tubes[i].length>0&&!done(tubes[i]))ok=false;
  }
  if(ok&&has)setTimeout(win,500);
}

function win(){
  const st=calcStars();
  const ce=st*10+5;
  S.coins+=ce;
  const ps=S.stars[S.lv]||0;
  if(st>ps)S.stars[S.lv]=st;
  S.chest=Math.min(S.chest+1,8);
  S.tube=Math.min(S.tube+1,8);
  save();
  const tl=S.lv+(8-S.chest);
  document.getElementById('pLv1').textContent=tl;
  document.getElementById('pLv2').textContent=tl;
  document.getElementById('pC1').textContent=S.chest;
  document.getElementById('pC2').textContent=S.tube;
  document.getElementById('pT1').textContent=8;
  document.getElementById('pT2').textContent=8;
  setTimeout(()=>{
    document.getElementById('pF1').style.width=(S.chest/8*100)+'%';
    document.getElementById('pF2').style.width=(S.tube/8*100)+'%';
  },300);
  go('win');
  confetti();
}

function calcStars(){
  const op=lp.n*3;
  if(moves<=op)return 3;
  if(moves<=op*1.5)return 2;
  return 1;
}

function next(){showFullscreenAd();startLv(S.lv+1)}
function restart(){startLv(S.lv)}

function updateAdBadges(){
  const hBadge=document.getElementById('hAd');
  const uBadge=document.getElementById('uAd');
  if(hBadge){
    if(S.hints<=0) hBadge.classList.add('show');
    else hBadge.classList.remove('show');
  }
  if(uBadge){
    if(S.undos<=0) uBadge.classList.add('show');
    else uBadge.classList.remove('show');
  }
}

function showAdHint(text){
  let hint=document.getElementById('adHint');
  if(!hint){
    hint=document.createElement('div');
    hint.id='adHint';
    hint.className='ad-hint';
    document.body.appendChild(hint);
  }
  hint.textContent=text;
  hint.classList.add('show');
  setTimeout(()=>hint.classList.remove('show'),2500);
}

function undo(){
  if(S.undos<=0){
    showAdHint('📺 Нажми ещё раз — получишь отмены за рекламу!');
    openAdModal('Посмотри рекламу и получи дополнительные отмены хода!','+3 отмены ↶',function(){
      S.undos+=3;
      document.getElementById('uC').textContent=S.undos;
      toast('+3 отмены!');
      updateAdBadges();
      save();
    });
    return;
  }
  if(hist.length===0){toast('Нет ходов!',true);return}
  const l=hist.pop();
  tubes[l.f]=l.ss;tubes[l.t]=l.ds;
  moves=Math.max(0,moves-1);
  S.undos--;
  document.getElementById('uC').textContent=S.undos;
  sel=null;render();
  updateAdBadges();
  save();
}

function hint(){
  if(S.hints<=0){
    showAdHint('📺 Нажми ещё раз — получишь подсказки за рекламу!');
    openAdModal('Посмотри рекламу и получи дополнительные подсказки!','+3 подсказки 💡',function(){
      S.hints+=3;
      document.getElementById('hC').textContent=S.hints;
      toast('+3 подсказки!');
      updateAdBadges();
      save();
    });
    return;
  }
  toast('Ищи одинаковые цвета сверху!');
  S.hints--;
  document.getElementById('hC').textContent=S.hints;
  updateAdBadges();
  save();
}

function openAdModal(text,reward,callback){
  document.getElementById('adText').textContent=text;
  document.getElementById('adReward').textContent=reward;
  adCallback=callback;
  document.getElementById('adOverlay').classList.add('on');
}

function closeAdModal(){
  document.getElementById('adOverlay').classList.remove('on');
  adCallback=null;
}

function watchAd(){
  const cb=adCallback;
  closeAdModal();
  showRewardedAd(cb);
}

function confetti(){
  const cols=['#e94560','#f39c12','#2ecc71','#3498db','#ffd700','#ff4081','#00d4ff'];
  for(let i=0;i<60;i++){
    setTimeout(()=>{
      const c=document.createElement('div');c.className='conf';
      c.style.left=Math.random()*100+'%';
      c.style.background=cols[Math.floor(Math.random()*cols.length)];
      c.style.animationDuration=(Math.random()*2+2)+'s';
      c.style.borderRadius=Math.random()>.5?'50%':'0';
      c.style.width=(Math.random()*10+6)+'px';
      c.style.height=(Math.random()*10+6)+'px';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),4000);
    },i*30);
  }
}

function toast(t,e){
  const x=document.getElementById('toast');
  x.textContent=t;x.className='toast show'+(e?' err':'');
  setTimeout(()=>x.classList.remove('show'),2500);
}

function save(){localStorage.setItem('bsp',JSON.stringify(S))}
function load(){
  const s=localStorage.getItem('bsp');
  if(s){try{const d=JSON.parse(s);S.lv=d.lv||1;S.coins=d.coins||50;S.stars=d.stars||{};S.chest=d.chest||0;S.tube=d.tube||0;S.hints=d.hints||2;S.undos=d.undos||5}catch(e){}}
}

load();updMenu();
</script>
</body>
</html>
